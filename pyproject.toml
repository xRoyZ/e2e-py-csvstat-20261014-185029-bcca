[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "csvstat"
version = "0.1.0"
description = "Command line tool that prints per-column statistics for a CSV file"
readme = "README.md"
requires-python = ">=3.9"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7,<10"]

[project.scripts]
csvstat = "csvstat.cli:main"

[tool.setuptools]
packages = ["csvstat"]
